# Custo em mensagens do heartbeat all-to-all: esperado N(N-1)/intervalo por segundo.
name = "hb-scale"
description = "Mensagens de heartbeat por segundo e latência de detecção vs. N"
algorithm = "heartbeat"
seeds = 10
warmup_s = 5
duration_s = 20

[base]
HB_INTERVAL_MS = 200
HB_TIMEOUT_MS = 600

[sweep]
N = [3, 5, 7, 9]

[[faults]]
at_s = 12
action = "kill"
target = "max"

[[plots]]
metric = "heartbeat_rate"
x = "N"
reference = "heartbeat_rate"
xlabel = "Número de nós (N)"
ylabel = "Heartbeats enviados por segundo"

[[plots]]
metric = "detection_latency_s"
x = "N"
xlabel = "Número de nós (N)"
ylabel = "Latência de detecção (s)"
